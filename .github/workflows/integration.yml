name: Integration

on:
  push:
    branches: [main, 'ci/**']
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Full suite or repeated descriptor handover diagnostics
        type: choice
        options: [full, proxy-descriptors]
        default: full

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps: &posix_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: anthropics/sandbox-runtime
          ref: 0bbebed0aa9a8e628dc4df8bc30293550a1988eb
          path: .upstream
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@2b3e8c2aeffd68d7aeb371c35e58699357aefffc # v0.5.25
      - name: Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat libseccomp-dev gcc default-jdk ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS sandbox prerequisites
        if: runner.os == 'macOS'
        run: brew install socat ripgrep
      - run: dart pub get
      - name: Build Linux helpers
        if: runner.os == 'Linux'
        run: |
          dart run tool/build_spawn_helper.dart
          dart run tool/build_seccomp.dart
      - run: dart run tool/build_java_proxy_agent.dart
      - name: Host and fidelity tests
        env:
          SRT_UPSTREAM: ${{ github.workspace }}/.upstream
          SUITE: ${{ inputs.suite || 'full' }}
        run: |
          if [[ "$SUITE" == proxy-descriptors ]]; then
            for attempt in {1..10}; do
              echo "Descriptor handover attempt $attempt/10"
              dart test test/proxy_cli_test.dart --name 'descriptor forms' -r expanded
            done
          else
            dart test -r expanded
          fi
  desktop-linux-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps: *posix_steps
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 45
    steps: *posix_steps
  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@2b3e8c2aeffd68d7aeb371c35e58699357aefffc # v0.5.25
      - run: dart pub get
      # Real MXC integration belongs to the embedding application.
      - run: dart test test/config_to_json_test.dart test/config_validation_test.dart test/public_exports_test.dart test/sandbox/mxc_config_test.dart test/sandbox/mxc_test.dart -r expanded
