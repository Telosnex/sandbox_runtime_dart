name: sandbox_runtime
description: >-
  Dart port of Anthropic Sandbox Runtime (srt) for restricting child process
  filesystem and network access on macOS, Linux, and Windows with an MXC adapter.
version: 1.0.0
repository: https://github.com/Telosnex/sandbox_runtime_dart

environment:
  sdk: ^3.9.0

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  ffi: ^2.1.3
  path: ^1.9.0
  pointycastle: ^4.0.0
  asn1lib: ^1.6.5

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
